<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REZSABM — breakout entry × SABM R-exits</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0f15; color: #ddeef6; font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 14px 18px; border-bottom: 1px solid #1a2535; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: #7090a0; font-size: 12.5px; }
  .wrap { padding: 14px 18px; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .stat { background: #101724; border: 1px solid #1a2535; border-radius: 8px; padding: 8px 12px; }
  .stat b { display: block; font-size: 16px; }
  .stat span { color: #7090a0; font-size: 11.5px; }
  img.graph { max-width: 100%; border: 1px solid #1a2535; border-radius: 8px; margin-bottom: 14px; display: block; }
  .row { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .tablebox { flex: 1 1 460px; max-height: 72vh; overflow: auto; border: 1px solid #1a2535; border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { padding: 4px 8px; text-align: right; border-bottom: 1px solid #141d2c; white-space: nowrap; }
  th { position: sticky; top: 0; background: #101724; color: #7090a0; cursor: default; }
  td:first-child, th:first-child { text-align: left; }
  tr.t { cursor: pointer; }
  tr.t:hover { background: #14203280; }
  tr.sel { background: #14283f; }
  .pos { color: #00d97e; } .neg { color: #f0364a; }
  .viewer { flex: 1 1 640px; position: sticky; top: 10px; }
  .viewer img { width: 100%; border: 1px solid #1a2535; border-radius: 8px; background: #0b0f15; }
  .viewer .cap { color: #7090a0; font-size: 12px; margin-top: 6px; }
  .filters { margin-bottom: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, button { background: #101724; color: #ddeef6; border: 1px solid #223148; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button.on { border-color: #00c8f0; color: #00c8f0; }
  a { color: #00c8f0; }
</style>
</head>
<body>
<header>
  <h1>REZSABM — entry: daily close above previous high (Rezvyakov breakout) · stop: body bottom · exit: stop or R-target</h1>
  <div class="sub" id="rule">loading…</div>
</header>
<div class="wrap">
  <div class="filters" style="position:relative">
    <label>Instrument <input id="symq" placeholder="search any symbol…" autocomplete="off"
      style="width:180px;background:#101724;color:#ddeef6;border:1px solid #223148;border-radius:6px;padding:5px 8px"></label>
    <div id="symres" style="position:absolute;top:36px;left:0;z-index:9;background:#101724;border:1px solid #223148;border-radius:8px;max-height:260px;overflow:auto;display:none;min-width:340px"></div>
    <button id="runsuite" disabled>▶ run all lines</button>
    <span class="sub" id="suitestat"></span>
    <label>Variant <select id="variant"></select></label>
    <button data-f="all" class="on">all</button>
    <button data-f="win">wins</button>
    <button data-f="loss">losses</button>
    <button data-f="acc">&gt;+1R accidents</button>
    <button data-f="gap">&lt;−1R gap losses</button>
    <button data-f="amb">ambiguous</button>
    <span class="sub" id="count"></span>
    <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
      <label class="sub">daily-open SL %</label>
      <input id="opensl" type="number" value="0.2" min="0.05" max="5" step="0.05"
             style="width:70px;background:#101724;color:#ddeef6;border:1px solid #223148;border-radius:6px;padding:5px 8px">
      <button id="runopen">▶ run daily-open</button>
      <span class="sub" id="runstat"></span>
    </span>
  </div>
  <div id="overview" class="tablebox" style="max-height:none;margin-bottom:14px"><table id="ovtbl">
    <thead><tr><th>strategy line</th><th>what it is</th><th>trades</th><th>win%</th><th>PF</th><th>compounded</th><th>buy&amp;hold</th></tr></thead>
    <tbody></tbody></table></div>
  <div id="desc" style="background:#101724;border:1px solid #1a2535;border-radius:8px;padding:10px 14px;margin-bottom:14px;color:#a8c2d0;font-size:13px;line-height:1.5"></div>
  <div class="stats" id="stats"></div>
  <img class="graph" id="g1" alt="portfolio">
  <img class="graph" id="g2" alt="distribution">
  <img class="graph" id="g3" alt="R1/R2/R3 comparison" onerror="this.hidden=true">
  <div class="row">
    <div class="tablebox"><table id="tbl">
      <thead><tr><th>entry</th><th>#</th><th>price</th><th>stop</th><th>target</th><th>exit</th><th>@</th><th>R</th><th>days</th><th>reason</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <div class="viewer" id="viewer" hidden>
      <img id="vid" alt="entry video">
      <div class="cap" id="cap"></div>
    </div>
  </div>
</div>
<script>
let VARIANTS = [];
let trades = [], stats = {}, filter = 'all', dir = '';

const fmt = (v, d = 2) => (v == null ? '—' : (+v).toFixed(d));
const el = id => document.getElementById(id);

function match(t) {
  if (filter === 'win') return t.r > 0;
  if (filter === 'loss') return t.r <= 0;
  if (filter === 'acc') return t.r > (parseFloat((stats.target || 'R1').slice(1)) || 1) + 0.0001;
  if (filter === 'gap') return t.r < -1.0001;
  if (filter === 'amb') return t.reason === 'ambiguous-stop';
  return true;
}

function shortDesc(st) {
  const d = st.description || st.rule || '';
  return d.length > 110 ? d.slice(0, 107) + '…' : d;
}

async function renderOverview() {
  const rows = await Promise.all(VARIANTS.map(async v => {
    try { return [v, await (await fetch(`results/${v}/stats.json`)).json()]; } catch { return [v, null]; }
  }));
  document.querySelector('#ovtbl tbody').innerHTML = rows.map(([v, st]) => st ? `
    <tr class="t" data-v="${v}" title="${(st.description || st.rule || '').replace(/"/g, '&quot;')}">
      <td><b>${v}</b></td>
      <td style="text-align:left;white-space:normal;min-width:320px">${shortDesc(st)}</td>
      <td>${st.trades}</td><td>${st.win_rate_pct_all_trades ?? st.win_rate_pct_significant}</td>
      <td>${st.profit_factor_significant ?? st.profit_factor}</td>
      <td class="${(st.final_compounded_pct ?? 0) >= 0 ? 'pos' : 'neg'}">${fmt(st.final_compounded_pct, 1)}%</td>
      <td>${fmt(st.buy_hold_pct, 0)}%</td></tr>` : '').join('');
  document.querySelector('#ovtbl tbody').onclick = e => {
    const tr = e.target.closest('tr[data-v]');
    if (tr) { dir = tr.dataset.v; el('variant').value = dir; load(); }
  };
}

function renderStats() {
  el('desc').innerHTML = `<b style="color:#ddeef6">${dir}</b> — ${stats.description || stats.rule || ''}` +
    (stats.note ? `<br><span style="color:#7090a0;font-size:12px">${stats.note}</span>` : '') +
    `<br><span style="color:#00c8f0">Performance: ${stats.trades} trades · win ${stats.win_rate_pct_all_trades ?? stats.win_rate_pct_significant}% · PF ${stats.profit_factor_significant ?? stats.profit_factor} · compounded ${fmt(stats.final_compounded_pct, 1)}% vs buy&hold ${fmt(stats.buy_hold_pct, 0)}%</span>`;
  el('rule').textContent = `${stats.symbol} ${stats.from} → ${stats.to} (${stats.bars} bars) · ${stats.rule} · gross, risk min(1%, R%) per trade, no leverage`;
  const items = [
    [stats.trades, 'trades'], [stats.win_rate_pct_significant + '%', 'win rate (significant)'], [stats.profit_factor_significant, 'profit factor (sig)'],
    [fmt(stats.avg_r, 3) + 'R', 'avg result'], [fmt(stats.sum_r, 1) + 'R', 'sum R'],
    [stats.positive_accidents_beyond_target, 'accidents beyond target'], [stats.gap_losses_worse_than_minus1R, 'gaps <−1R'],
    [stats.ambiguous_days_pessimistic, 'ambiguous→stop'], [stats.median_hold_days + 'd', 'median hold'],
    [fmt(stats.final_fixed_pct, 1) + '%', 'fixed 1% final'], [fmt(stats.final_compounded_pct, 1) + '%', 'compounded 1% final'],
    [fmt(stats.maxdd_compounded_pct_points_SABM, 1) + ' pts', 'maxDD SABM-style'], [fmt(stats.maxdd_compounded_pct_relative, 1) + '%', 'maxDD relative'], [fmt(stats.buy_hold_pct, 0) + '%', 'buy & hold'],
  ];
  el('stats').innerHTML = items.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
}

function renderTable() {
  const rows = trades.filter(match);
  el('count').textContent = `${rows.length} shown of ${trades.length}`;
  el('tbl').tBodies[0].innerHTML = rows.map(t => `
    <tr class="t" data-n="${t.n}"><td>${t.entry_date}</td><td>#${t.n}</td><td>${t.entry_price}</td>
    <td>${t.stop}</td><td>${t.target}</td><td>${t.exit_date}</td><td>${t.exit_price}</td>
    <td class="${t.r > 0 ? 'pos' : 'neg'}">${t.r > 0 ? '+' : ''}${fmt(t.r)}</td><td>${t.days}</td><td>${t.reason}</td></tr>`).join('');
}

function show(n) {
  const t = trades.find(x => x.n === +n);
  if (!t) return;
  document.querySelectorAll('tr.sel').forEach(r => r.classList.remove('sel'));
  const row = document.querySelector(`tr[data-n="${n}"]`);
  if (row) row.classList.add('sel');
  el('viewer').hidden = false;
  if (t.video) {
    el('vid').src = `results/${dir}/${t.video}`;
    el('cap').textContent = `#${t.n} ${t.entry_date} @ ${t.entry_price} → ${t.exit_date} @ ${t.exit_price} (${t.r > 0 ? '+' : ''}${fmt(t.r)}R, ${t.reason}, ${t.days}d) — animation restarts on reopen`;
  } else {
    el('vid').removeAttribute('src');
    el('cap').textContent = 'no video for this variant (videos exist only for variants that were rendered with --videos)';
  }
  el('viewer').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function load() {
  stats = await (await fetch(`results/${dir}/stats.json`)).json();
  trades = await (await fetch(`results/${dir}/trades.json`)).json();
  renderStats();
  el('g1').src = `results/${dir}/graph_portfolio.png`;
  el('g2').src = `results/${dir}/graph_distribution.png`;
  el('g3').hidden = false;
  el('g3').src = `results/${stats.symbol}_graph_compare.png`;
  renderTable();
  el('viewer').hidden = true;
}

el('variant').onchange = e => { dir = e.target.value; load(); };
(async () => {
  VARIANTS = await (await fetch('/api/variants')).json();
  el('variant').innerHTML = VARIANTS.map(v => `<option>${v}</option>`).join('');
  dir = VARIANTS[0] || '';
  renderOverview();
  if (dir) load();
})();
document.querySelectorAll('button[data-f]').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('button[data-f]').forEach(x => x.classList.toggle('on', x === b));
  renderTable();
});
el('tbl').onclick = e => { const tr = e.target.closest('tr.t'); if (tr) show(tr.dataset.n); };
let pickedSym = '';
let symTimer = null;
el('symq').oninput = () => {
  clearTimeout(symTimer);
  const q = el('symq').value.trim();
  if (q.length < 1) { el('symres').style.display = 'none'; return; }
  symTimer = setTimeout(async () => {
    const r = await (await fetch(`/api/ticker-search?q=${encodeURIComponent(q)}`)).json();
    const rows = (r.results || []).slice(0, 14);
    el('symres').innerHTML = rows.map(x =>
      `<div class="symrow" data-s="${x.symbol}" style="padding:6px 10px;cursor:pointer">
         <b>${x.symbol}</b> <span class="sub">${x.name} · ${x.exch} ${x.type}</span></div>`).join('') ||
      '<div style="padding:6px 10px" class="sub">no matches</div>';
    el('symres').style.display = 'block';
  }, 250);
};
el('symres').onclick = async e => {
  const row = e.target.closest('.symrow');
  if (!row) return;
  pickedSym = row.dataset.s;
  el('symq').value = pickedSym;
  el('symres').style.display = 'none';
  el('suitestat').textContent = `fetching ${pickedSym} history…`;
  const r = await (await fetch(`/api/fetch-ohlc?symbol=${encodeURIComponent(pickedSym)}`, { method: 'POST' })).json();
  if (r.error) { el('suitestat').textContent = r.error; return; }
  el('suitestat').textContent = `${r.symbol}: ${r.rows} bars ${r.from} → ${r.to} — ready`;
  el('runsuite').disabled = false;
};
el('runsuite').onclick = async () => {
  if (!pickedSym) return;
  const r = await (await fetch(`/api/run-suite?symbol=${encodeURIComponent(pickedSym)}`, { method: 'POST' })).json();
  if (r.error) { el('suitestat').textContent = r.error; return; }
  el('suitestat').textContent = `running suite for ${r.symbol}…`;
  const timer = setInterval(async () => {
    const st = await (await fetch('/api/run-suite-status')).json();
    el('suitestat').textContent = st.running ? `suite ${st.symbol}: ${st.tail}` : `suite done`;
    VARIANTS = await (await fetch('/api/variants')).json();
    el('variant').innerHTML = VARIANTS.map(v => `<option>${v}</option>`).join('');
    if (!st.running) { clearInterval(timer); renderOverview(); }
  }, 8000);
};
el('runopen').onclick = async () => {
  const sl = el('opensl').value;
  const r = await (await fetch(`/api/run-open?sl=${sl}`, { method: 'POST' })).json();
  if (r.error) { el('runstat').textContent = r.error; return; }
  el('runstat').textContent = `running ${r.variant}…`;
  const timer = setInterval(async () => {
    const st = await (await fetch('/api/run-open-status')).json();
    el('runstat').textContent = st.running ? `running: ${st.tail}` : 'done — refreshing';
    if (!st.running) {
      clearInterval(timer);
      VARIANTS = await (await fetch('/api/variants')).json();
      el('variant').innerHTML = VARIANTS.map(v => `<option>${v}</option>`).join('');
      renderOverview();
      if (VARIANTS.includes(r.variant)) { dir = r.variant; el('variant').value = dir; load(); }
      el('runstat').textContent = `done: ${r.variant}`;
    }
  }, 5000);
};
</script>
</body>
</html>
